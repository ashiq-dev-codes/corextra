name: corextra
description: Handy Dart extensions and utility functions for easier coding.
version: 1.2.3
homepage: https://github.com/ashiq-dev-codes/corextra
repository: https://github.com/ashiq-dev-codes/corextra.git
issue_tracker: https://github.com/ashiq-dev-codes/corextra/issues

environment:
  sdk: ^3.7.0
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.2
  intl: ^0.20.2
  archive: ^4.0.7
  file_selector: ^1.1.0
  device_info_plus: ">=11.5.0 <14.0.0"
  package_info_plus: ">=8.3.1 <11.0.0"
  lucide_icons_flutter: ^3.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter

  test: ^1.31.0
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.corextra.corextra
        pluginClass: CorextraPlugin
